<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outlines</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
    .box{
        box-sizing: border-box;
        border: 2px solid black;
        color: aliceblue;
        background-color: hotpink;
        width: 500px;
        min-height: 40vh;
    }
    .box1{
        box-sizing: border-box;
        border: 2px solid yellow;
        margin: 10px;
        height: 3vh;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    div ul{
        display:inline;
    }
    div ul li{
        margin: 10vh;
        display: inline;
        text-align: right;
    }
    div.box pre{
        font-family: 'Times New Roman', Times, serif;
    }

    </style>
</head>
<body>
    <div class="box1">
         <img src="img1.png" height="10px"  alt="wikipedia logo"> 
        WIKIPEDIA       
    <ul>
        <li>Home</li>
        <li>Contact</li>
        <li>Help</li>
    </ul>
    </div>
    <div>
        Information about ________.
    </div>
    <div class="box">
        <pre>
Hi, I am a Box.
wanna be redirected? click here &gt; 
<a href="http://www.youtube.com" >Redirect me</a> 
        </pre>
    </div>
    
</body>
</html>
