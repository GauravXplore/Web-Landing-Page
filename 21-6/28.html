<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
    .box{
        height: 433px;
        width: 80vw;
        padding: 3px;
        margin: 3px;             
        border: 2px solid black;
    }
    /* if position is anything other than static, funtions like z-index top left bottom can be applied */
    .box1{
         background-color: aqua;
         position: absolute;
          top: 0px;
         left: 7px; 
         /* position: sticky; */
         /* sticky makes the block a fixed element until the html border  reaches it */
         /* height: 111px;
         width: 100%;
         margin: 0;
         padding: 0; */
    }
    /* absolute makes the element get positioned with respect to its nearest positioned ancestor */
    .box2{
         background-color: azure;
         /* position: relative;
         top: 34px;
         left: 56px; */
        }
    .box3{
         background-color: antiquewhite;
         /* position: fixed;
         height: 111px;
         bottom: 0px;
         left: 8vw;  */
    }
    /* position- fixed is used when we want the content we wanna show to be available throughout the page */
    .box4{
         background-color: purple;
    }
    /* position of an element is static by nature meaning it stays where it was created any function will not affect it */
    .parent{
        padding: 43px;
        margin: 34px;
        border: 2px solid purple;
        /* position: fixed; */
        /* transform: translate(0) ; */
        filter: invert(0);
        perspective: 0em;
        /*Exceptions: transform, filter or perspective properties can also make an element appear as positioned */
    }
    /* position of child boxes will be relative to html until the position of parent isn't defined */
    /* the box having higher z index value will be placed above the other */
    </style>
</head>
<body>
    <div class="parent">
        
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
        
    </div>
</body>
</html>
