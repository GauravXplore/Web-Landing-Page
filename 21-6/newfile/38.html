<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
           .container{
            border: 2px solid red;
            display: flex;
            height: 50vh;
            justify-content: center;
            align-items: center; 
            /* We apply display = flex on the container not the items this makes the container a flexbox and we can apply flexbox properties on the items inside the container. */ 
           }
           .item{
            height: 52px;
            width: 52px;
            border: 2px solid black;
            background-color: blueviolet;
            margin: 4px;
           }
    </style>
</head>
<body>

    <main>
        <div class="container">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </main>
    
</body>
</html>
