          /* attribute selector below

           /* .box:nth-child(odd){
            background-color: blue;

           } */
            /* .box:nth-last-child(2){
             background-color: red;
            } */
             .boxes::before{
                content: "Hehe";
             }
              .boxes::after{
                content: "Hahaha";
              }
              /* Pseudo elements examples */
              .boxes::selection{
                background-color: red;
                color: white;
              }
              .box::first-letter{
                color: red;
                font-size: 30px;
              }
              input::placeholder{
                color: blue;
               }
    </style>
</head>
<body>
    <div class="boxes">
        <div data-color="primary" class="box">I am first Box.</div>
        <div class="box">Hey I am a Box.</div>
        <div class="box">Hey I am a Box.</div>
        <input type="text" placeholder ="Type your name here">
    </div>

    
</body>
