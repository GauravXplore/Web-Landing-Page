<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise8</title>
    <style>
        .container{
        border: 2px solid black;
        height: 50vh;
        width:97vw;
        position: relative;
        background-color: rgb(197, 197, 247);
        }
        .box{
        background-color:red;
        width:60px;
        height:60px;
        position: absolute;
        bottom: 0;
        left: 0;
        border-radius: 70px;
        animation: animateX 3s linear infinite
        ,animateY 1s ease-out infinite alternate;
        }
        @keyframes animateX{
            from{
              left:0;
            }
            to{
            left:100%;
            }
        }
        @keyframes animateY{
            from{
                bottom:0;
            }
            to{
                bottom:100%;
            }
        }
